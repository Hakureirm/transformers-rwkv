name: rwkv7 checks

# Deliberately on a branch of its own rather than in the PR. Upstream transformers
# runs its own CI on CircleCI, and adding a GitHub Actions workflow to a model PR
# would put a file in the diff that has nothing to do with the model. This branch
# carries the workflow, checks out the PR branch, and runs the same checks a
# maintainer would run by hand, so the result is a link rather than a claim.
on:
  workflow_dispatch:
  push:
    branches: [ci-add-rwkv7]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: add-rwkv7
          # Full history, and `main` as well: check_modular_conversion computes the
          # changed-file set from `git merge-base main HEAD`, so a shallow clone of one
          # branch makes it fail on a missing ref rather than on anything it checks.
          fetch-depth: 0

      - name: Make the upstream main ref available
        run: git fetch --no-tags --depth=1 origin main:main || git fetch --no-tags origin main:main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          # check_repo walks every public object in the library, so it needs the
          # dependencies of modules that have nothing to do with this model -- PIL for
          # the image processors, for one. Installing them is cheaper than narrowing
          # the check and pretending the narrow version is the one upstream runs.
          pip install -q -e ".[quality]" pytest parameterized pytest-xdist accelerate GitPython pillow

      - name: ruff check
        run: ruff check src/transformers/models/rwkv7/ tests/models/rwkv7/ benchmark_v2/benchmark_scripts/

      - name: ruff format --check
        run: ruff format --check src/transformers/models/rwkv7/ tests/models/rwkv7/ benchmark_v2/benchmark_scripts/

      - name: modular consistency
        run: python utils/check_modular_conversion.py

      - name: repo consistency
        run: |
          python utils/check_repo.py
          python utils/check_docstrings.py
          python utils/check_doc_toc.py
          python utils/check_copies.py
          python utils/check_inits.py

      - name: tests
        run: python -m pytest tests/models/rwkv7/ -v -p no:warnings
